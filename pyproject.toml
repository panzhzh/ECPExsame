[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iemomecp"
version = "0.1.0"
description = "Pair-role label overlay and diagnostics for IEMO-MECP."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "matplotlib>=3.7",
  "pillow>=9.0",
]

[project.optional-dependencies]
train = [
  "scikit-learn>=1.3",
  "torch>=2.1",
  "tqdm>=4.66",
  "transformers>=4.40",
]

[tool.setuptools.packages.find]
where = ["src"]
